<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard - Quản trị câu hỏi</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
        }

        .dashboard {
            max-width: 1440px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 10px rgba(30, 41, 59, 0.2);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left h1 {
            font-size: 16px;
            font-weight: 700;
        }

        .header-left h1 .highlight {
            color: #fbbf24;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .header-right .user-email {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 12px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 12px;
        }

        .header-right .logout-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: white;
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 12px;
            font-weight: 600;
        }

        .header-right .logout-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 8px 14px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
            border-left: 3px solid #1e293b;
        }

        .stat-card:hover {
            transform: translateY(-1px);
        }

        .stat-card .stat-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .stat-card .stat-info {
            flex: 1;
            min-width: 0;
        }

        .stat-card .number {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.2;
        }

        .stat-card .label {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-card.accent-red { border-left-color: #dc2626; }
        .stat-card.accent-yellow { border-left-color: #fbbf24; }
        .stat-card.accent-blue { border-left-color: #3b82f6; }

        /* ===== MAIN LAYOUT ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .right-panel { max-height: 380px !important; }
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            body { padding: 8px; }
        }

        /* ===== LEFT COLUMN ===== */
        .left-panel {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .panel-header h2 { font-size: 15px; color: #1e293b; }
        .panel-header .actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .panel-header .actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 11px;
        }

        .btn-export { background: #16a34a; color: white; }
        .btn-export:hover { background: #15803d; }
        .btn-refresh { background: #3b82f6; color: white; }
        .btn-refresh:hover { background: #2563eb; }
        .btn-clear { background: #dc2626; color: white; }
        .btn-clear:hover { background: #b91c1c; }

        /* ===== SEARCH & FILTER ===== */
        .search-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .search-bar input {
            flex: 1;
            min-width: 120px;
            padding: 6px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            background: #f8fafc;
        }

        .search-bar select {
            padding: 6px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            background: #f8fafc;
            cursor: pointer;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            min-height: 0;
        }

        .question-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .question-table thead { position: sticky; top: 0; z-index: 10; }
        .question-table th {
            background: #1e293b;
            color: white;
            padding: 7px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            white-space: nowrap;
        }

        .question-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
            vertical-align: middle;
            font-size: 12px;
        }

        .question-table tbody tr { cursor: pointer; transition: background 0.15s; }
        .question-table tbody tr:hover { background: #f1f5f9; }
        .question-table tbody tr.active { background: #e0e7ff; }

        .field-tag {
            padding: 1px 8px;
            background: #e2e8f0;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }

        .area-tag {
            padding: 1px 8px;
            background: #dbeafe;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            color: #1e40af;
        }

        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: #fef3c7;
            color: #b45309;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-btn:hover { color: #dc2626; background: #fef2f2; }

        .truncate {
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .empty-state, .loading-state { text-align: center; padding: 30px 20px; color: #94a3b8; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #1e293b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== RIGHT PANEL ===== */
        .right-panel {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            flex-shrink: 0;
        }

        .detail-header h3 { font-size: 14px; color: #1e293b; font-weight: 700; }
        .detail-header .close-detail { background: none; border: none; font-size: 18px; color: #94a3b8; cursor: pointer; }

        #detailContent { flex: 1; overflow-y: auto; min-height: 0; }
        .detail-empty { text-align: center; padding: 25px 12px; color: #94a3b8; }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            margin-bottom: 10px;
        }

        .detail-item { display: flex; flex-direction: column; }
        .detail-item.full-width { grid-column: 1 / -1; }
        .detail-item .label { font-size: 9px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .detail-item .value { font-size: 13px; color: #1e293b; word-break: break-word; font-weight: 500; }

        .question-full {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #1e293b;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 2px;
        }

        .attachment-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .attachment-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            padding: 8px 12px;
            border-radius: 8px;
            color: #0284c7;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .attachment-btn:hover { background: #e0f2fe; }

        .detail-actions {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .detail-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-delete-detail { background: #dc2626; color: white; }
        .btn-delete-detail:hover { background: #b91c1c; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
            font-size: 13px;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <img src="logo-mat-tran-to-quoc-viet-nam-01.png" alt="Logo" style="width:28px; height:28px; border-radius:4px;" onerror="this.style.display='none'">
                <h1><span class="highlight">Mặt trận Tổ quốc Việt Nam Phường Ninh Kiều</span></h1>
            </div>
            <div class="header-right">
                <span class="user-email" id="userEmail">admin@email.com</span>
                <button class="logout-btn" onclick="logout()">🚪 Đăng xuất</button>
            </div>
        </header>

        <!-- ===== STATS ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-icon">📬</span>
                <div class="stat-info">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Tổng câu hỏi</div>
                </div>
            </div>
            <div class="stat-card accent-red">
                <span class="stat-icon">📂</span>
                <div class="stat-info">
                    <div class="number" id="topField">0</div>
                    <div class="label">Tổng số lĩnh vực</div>
                </div>
            </div>
            <div class="stat-card accent-yellow">
                <span class="stat-icon">👤</span>
                <div class="stat-info">
                    <div class="number" id="topPerson">0</div>
                    <div class="label">Số lượng người gửi</div>
                </div>
            </div>
            <div class="stat-card accent-blue">
                <span class="stat-icon">📍</span>
                <div class="stat-info">
                    <div class="number" id="topArea">—</div>
                    <div class="label">Khu vực gửi nhiều nhất</div>
                </div>
            </div>
        </div>

        <!-- ===== MAIN GRID ===== -->
        <div class="main-grid">
            <!-- LEFT: Table -->
            <div class="left-panel">
                <div class="panel-header">
                    <h2>📋 Danh sách câu hỏi</h2>
                    <div class="actions">
                        <button class="btn-export" onclick="exportSummary()">📨 Xuất Excel</button>
                        <button class="btn-refresh" onclick="loadQuestions()">🔄</button>
                        <button class="btn-clear" onclick="clearAll()">🗑️</button>
                    </div>
                </div>

                <!-- Search & Filter -->
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm..." oninput="filterQuestions()">
                    
                    <!-- BỘ LỌC THỜI GIAN THEO NĂM, THÁNG, TUẦN -->
                    <select id="yearFilter" onchange="filterQuestions()">
                        <option value="">📅 Tất cả năm</option>
                    </select>

                    <select id="monthFilter" onchange="filterQuestions()">
                        <option value="">📅 Tất cả tháng</option>
                        <option value="1">Tháng 1</option>
                        <option value="2">Tháng 2</option>
                        <option value="3">Tháng 3</option>
                        <option value="4">Tháng 4</option>
                        <option value="5">Tháng 5</option>
                        <option value="6">Tháng 6</option>
                        <option value="7">Tháng 7</option>
                        <option value="8">Tháng 8</option>
                        <option value="9">Tháng 9</option>
                        <option value="10">Tháng 10</option>
                        <option value="11">Tháng 11</option>
                        <option value="12">Tháng 12</option>
                    </select>

                    <select id="weekFilter" onchange="filterQuestions()">
                        <option value="">📅 Tất cả tuần</option>
                        <option value="1">Tuần 1 (Ngày 1-7)</option>
                        <option value="2">Tuần 2 (Ngày 8-14)</option>
                        <option value="3">Tuần 3 (Ngày 15-21)</option>
                        <option value="4">Tuần 4 (Ngày 22 trở đi)</option>
                    </select>

                    <select id="fieldFilter" onchange="filterQuestions()">
                        <option value="">📂 Tất cả lĩnh vực</option>
                    </select>
                    
                    <select id="areaFilter" onchange="filterQuestions()">
                        <option value="">📍 Tất cả khu vực</option>
                    </select>
                </div>

                <!-- Table -->
                <div class="table-wrapper">
                    <table class="question-table">
                        <thead>
                            <tr>
                                <th style="width:24px;">#</th>
                                <th>Họ tên</th>
                                <th>SĐT</th>
                                <th>Lĩnh vực</th>
                                <th>Khu vực</th>
                                <th>File</th>
                                <th style="width:28px;"></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="7">
                                    <div class="empty-state">
                                        <div class="icon">📭</div>
                                        <p>Chưa có câu hỏi nào</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- RIGHT: Detail Panel -->
            <div class="right-panel" id="detailPanel">
                <div class="detail-header">
                    <h3>📄 Chi tiết câu hỏi</h3>
                    <button class="close-detail" onclick="clearDetail()">✕</button>
                </div>
                <div id="detailContent">
                    <div class="detail-empty">
                        <div class="icon">👆</div>
                        <p>Chọn một câu hỏi để xem chi tiết</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCAn-dCRdVkbYZYuh_wWWKPe2-5_meQuBA",
            authDomain: "hoidap-ff5ed.firebaseapp.com",
            databaseURL: "https://hoidap-ff5ed-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoidap-ff5ed",
            storageBucket: "hoidap-ff5ed.firebasestorage.app",
            messagingSenderId: "747872918560",
            appId: "1:747872918560:web:f9f0d5073d083a46e03045"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // DOM REFS
        const userEmail = document.getElementById('userEmail');
        const totalCount = document.getElementById('totalCount');
        const topField = document.getElementById('topField');
        const topPerson = document.getElementById('topPerson');
        const topArea = document.getElementById('topArea');
        const tableBody = document.getElementById('tableBody');
        const detailContent = document.getElementById('detailContent');
        const searchInput = document.getElementById('searchInput');
        
        const yearFilter = document.getElementById('yearFilter');
        const monthFilter = document.getElementById('monthFilter');
        const weekFilter = document.getElementById('weekFilter');
        const fieldFilter = document.getElementById('fieldFilter');
        const areaFilter = document.getElementById('areaFilter');
        const toast = document.getElementById('toast');

        let allQuestions = [];
        let filteredQuestions = [];
        let selectedId = null;
        let toastTimeout = null;
        let githubConfig = null;

        // AUTH
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            userEmail.textContent = user.email;
            loadGithubConfig();
            loadQuestions();
        });

        function logout() {
            auth.signOut().then(() => { window.location.href = 'index.html'; });
        }

        async function loadGithubConfig() {
            try {
                const snap = await database.ref('sharedConfig/githubConfig').once('value');
                githubConfig = snap.val();
                if (githubConfig) {
                    console.log("✅ Đã kết nối thành công tới GitHub Token:", githubConfig.owner);
                }
            } catch(e) { 
                console.warn('⚠️ Lỗi kết nối GitHub Config:', e); 
            }
        }

        // LOAD CÂU HỎI TỪ FIREBASE REALTIME
        function loadQuestions() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p style="margin-top:6px; color:#94a3b8; font-size:12px;">Đang tải dữ liệu...</p>
                        </div>
                    </td>
                </tr>
            `;

            const ref = database.ref('questions/public/items');
            ref.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    allQuestions = [];
                    renderTable();
                    updateStats([]);
                    return;
                }

                allQuestions = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                allQuestions.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                updateFilters();
                filterQuestions();
            }, error => {
                console.error("Lỗi Firebase Database:", error);
                showToast("❌ Lỗi tải dữ liệu: " + error.message, "error");
            });
        }

        // CẬP NHẬT CÁC ĐIỀU KIỆN LỌC (CÓ COMBOBOX NĂM TỰ ĐỘNG)
        function updateFilters() {
            const fieldSet = new Set();
            const areaSet = new Set();
            const yearSet = new Set();

            allQuestions.forEach(q => {
                if (q.field) fieldSet.add(q.field);
                if (q.area && q.area.trim()) areaSet.add(q.area);
                
                // Trích xuất Năm từ timestamp hoặc created
                let d = q.timestamp ? new Date(q.timestamp) : (q.created ? new Date(q.created) : null);
                if (d && !isNaN(d.getTime())) {
                    yearSet.add(d.getFullYear());
                }
            });

            // Update Năm Combobox
            const currentYear = yearFilter.value;
            yearFilter.innerHTML = '<option value="">📅 Tất cả năm</option>';
            [...yearSet].sort((a,b) => b - a).forEach(y => {
                const opt = document.createElement('option');
                opt.value = y; opt.textContent = `Năm ${y}`;
                yearFilter.appendChild(opt);
            });
            yearFilter.value = currentYear;

            // Update Lĩnh vực
            const currentField = fieldFilter.value;
            fieldFilter.innerHTML = '<option value="">📂 Tất cả lĩnh vực</option>';
            [...fieldSet].sort().forEach(f => {
                const opt = document.createElement('option');
                opt.value = f; opt.textContent = f;
                fieldFilter.appendChild(opt);
            });
            fieldFilter.value = currentField;

            // Update Khu vực
            const currentArea = areaFilter.value;
            areaFilter.innerHTML = '<option value="">📍 Tất cả khu vực</option>';
            [...areaSet].sort().forEach(a => {
                const opt = document.createElement('option');
                opt.value = a; opt.textContent = a;
                areaFilter.appendChild(opt);
            });
            areaFilter.value = currentArea;
        }

        // KIỂM TRẢ THỜI GIAN THEO NĂM, THÁNG, TUẦN
        function checkDateMatch(timestamp, createdStr, yVal, mVal, wVal) {
            if (!yVal && !mVal && !wVal) return true;

            let date = timestamp ? new Date(timestamp) : (createdStr ? new Date(createdStr) : null);
            if (!date || isNaN(date.getTime())) return true;

            // 1. Lọc theo Năm
            if (yVal && date.getFullYear() !== parseInt(yVal)) {
                return false;
            }

            // 2. Lọc theo Tháng (1 - 12)
            if (mVal && (date.getMonth() + 1) !== parseInt(mVal)) {
                return false;
            }

            // 3. Lọc theo Tuần trong Tháng (Tuần 1 đến Tuần 4)
            if (wVal) {
                const day = date.getDate();
                let week = 1;
                if (day > 21) week = 4;
                else if (day > 14) week = 3;
                else if (day > 7) week = 2;

                if (week !== parseInt(wVal)) {
                    return false;
                }
            }

            return true;
        }

        function filterQuestions() {
            const keyword = searchInput.value.toLowerCase().trim();
            const yVal = yearFilter.value;
            const mVal = monthFilter.value;
            const wVal = weekFilter.value;
            const fieldVal = fieldFilter.value;
            const areaVal = areaFilter.value;

            filteredQuestions = allQuestions.filter(q => {
                const matchKeyword = !keyword || 
                    (q.fullName && q.fullName.toLowerCase().includes(keyword)) ||
                    (q.phone && q.phone.includes(keyword)) ||
                    (q.question && q.question.toLowerCase().includes(keyword));
                
                const matchDate = checkDateMatch(q.timestamp, q.created, yVal, mVal, wVal);
                const matchField = !fieldVal || q.field === fieldVal;
                const matchArea = !areaVal || q.area === areaVal;

                return matchKeyword && matchDate && matchField && matchArea;
            });

            renderTable();
            updateStats(filteredQuestions);
        }

        function renderTable() {
            const data = filteredQuestions;

            if (data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="icon">📭</div>
                                <p>Không tìm thấy câu hỏi nào</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            data.forEach((q, index) => {
                const isActive = q.id === selectedId;
                
                const fileCount = (q.files && q.files.length) || (q.fileUrl || q.file ? 1 : 0);
                const fileBadge = fileCount > 0 
                    ? `<span class="file-badge">📎 ${fileCount}</span>` 
                    : '<span style="color:#cbd5e1;">—</span>';

                html += `
                    <tr class="${isActive ? 'active' : ''}" onclick="selectQuestion('${q.id}')">
                        <td>${index + 1}</td>
                        <td><span class="truncate" title="${escapeHtml(q.fullName || 'Chưa nhập')}">${escapeHtml(q.fullName || '—')}</span></td>
                        <td>${escapeHtml(q.phone || '—')}</td>
                        <td><span class="field-tag">${escapeHtml(q.field || 'Chung')}</span></td>
                        <td>${q.area ? `<span class="area-tag">${escapeHtml(q.area)}</span>` : '—'}</td>
                        <td>${fileBadge}</td>
                        <td>
                            <button class="delete-btn" onclick="event.stopPropagation(); deleteQuestion('${q.id}')" title="Xóa">✕</button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;

            if (selectedId && !data.some(q => q.id === selectedId)) {
                clearDetail();
            }
        }

        function selectQuestion(id) {
            const q = allQuestions.find(item => item.id === id);
            if (!q) return;

            selectedId = id;
            renderTable();

            let areaDisplay = q.area ? `<span class="area-tag">${escapeHtml(q.area)}</span>` : '—';

            let filesHtml = '<span style="color:#94a3b8; font-size:12px;">Không có file đính kèm</span>';
            
            if (q.files && Array.isArray(q.files) && q.files.length > 0) {
                filesHtml = '<div class="attachment-list">';
                q.files.forEach((f, idx) => {
                    const fileName = escapeHtml(f.name || `Tệp_${idx + 1}`);
                    if (f.ghPath) {
                        filesHtml += `
                            <div class="attachment-btn" onclick="downloadPrivateFile('${f.ghPath}', '${fileName}')">
                                <span>📄 ${fileName}</span>
                                <span>⬇️ Tải về</span>
                            </div>`;
                    } else if (f.url) {
                        filesHtml += `
                            <a href="${f.url}" target="_blank" class="attachment-btn">
                                <span>📄 ${fileName}</span>
                                <span>👁️ Xem/Tải</span>
                            </a>`;
                    }
                });
                filesHtml += '</div>';
            } 
            else if (q.fileUrl || q.file || q.ghPath) {
                const targetUrl = q.fileUrl || q.file;
                const fileName = escapeHtml(q.fileName || 'Tệp_đính_kèm');
                if (q.ghPath) {
                    filesHtml = `
                        <div class="attachment-list">
                            <div class="attachment-btn" onclick="downloadPrivateFile('${q.ghPath}', '${fileName}')">
                                <span>📄 ${fileName}</span>
                                <span>⬇️ Tải về</span>
                            </div>
                        </div>`;
                } else if (targetUrl) {
                    filesHtml = `
                        <div class="attachment-list">
                            <a href="${targetUrl}" target="_blank" class="attachment-btn">
                                <span>📄 ${fileName}</span>
                                <span>👁️ Xem/Tải</span>
                            </a>
                        </div>`;
                }
            }

            detailContent.innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="label">Họ và tên</span>
                        <span class="value"><strong>${escapeHtml(q.fullName || '—')}</strong></span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Số điện thoại</span>
                        <span class="value">${escapeHtml(q.phone || '—')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Địa chỉ</span>
                        <span class="value">${escapeHtml(q.address) || '—'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Khu vực</span>
                        <span class="value">${areaDisplay}</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Lĩnh vực</span>
                        <span class="value"><span class="field-tag">${escapeHtml(q.field || 'Chung')}</span></span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Thời gian gửi</span>
                        <span class="value" style="color:#64748b;">${escapeHtml(q.created) || '—'}</span>
                    </div>
                    <div class="detail-item full-width">
                        <span class="label">Nội dung câu hỏi</span>
                        <div class="question-full">${escapeHtml(q.question || 'Chưa có nội dung')}</div>
                    </div>
                    <div class="detail-item full-width" style="margin-top: 6px;">
                        <span class="label">📎 Tệp đính kèm</span>
                        ${filesHtml}
                    </div>
                </div>
                <div class="detail-actions">
                    <button class="btn-delete-detail" onclick="deleteQuestion('${q.id}')">🗑️ Xóa câu hỏi</button>
                </div>
            `;
        }

        async function downloadPrivateFile(ghPath, fileName, itemGithubRepo) {
            try {
                showToast("⏳ Đang lấy cấu hình từ Firebase...", "success");

                let owner = "Phuong-Ninh-Kieu";
                let repo = "Storage-Private";
                if (itemGithubRepo && itemGithubRepo.includes('/')) {
                    const parts = itemGithubRepo.split('/');
                    owner = parts[0].trim();
                    repo = parts[1].trim();
                }

                let token = "";
                try {
                    const snap = await database.ref('questions/public/sharedConfig/githubConfig').once('value');
                    if (snap.exists()) {
                        const config = snap.val();
                        token = config.token || "";
                        if (config.owner) owner = config.owner;
                        if (config.repo) repo = config.repo;
                    }
                } catch (e) {
                    console.warn("Lỗi đọc Firebase:", e);
                }

                if (!token) {
                    alert("⚠️ Không tìm thấy Token trong 'questions/public/sharedConfig/githubConfig'. Vui lòng kiểm tra lại giá trị token trên Firebase!");
                    return;
                }

                showToast("⏳ Đang tải tệp từ GitHub...", "success");

                const cleanPath = String(ghPath).replace(/^\//, '').trim();
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURI(cleanPath)}`;

                const res = await fetch(apiUrl, {
                    headers: {
                        'Authorization': 'token ' + String(token).trim(),
                        'Accept': 'application/vnd.github+json'
                    }
                });

                if (!res.ok) {
                    if (res.status === 401) throw new Error("Token GitHub bị sai hoặc đã bị hết hạn (Lỗi 401)!");
                    if (res.status === 404) throw new Error("Không tìm thấy tệp trên GitHub (Lỗi 404)!");
                    throw new Error(`Lỗi kết nối GitHub API (${res.status})`);
                }

                const json = await res.json();
                if (!json.content) throw new Error("Nội dung tệp rỗng!");

                const base64Clean = json.content.replace(/\n/g, '');
                const byteCharacters = atob(base64Clean);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray]);

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName || cleanPath.split('/').pop() || 'Tep_Dinh_Kem';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast("✅ Tải tệp thành công!", "success");
            } catch (err) {
                console.error("Lỗi downloadPrivateFile:", err);
                alert("❌ " + err.message);
            }
        }

        function clearDetail() {
            selectedId = null;
            renderTable();
            detailContent.innerHTML = `
                <div class="detail-empty">
                    <div class="icon">👆</div>
                    <p>Chọn một câu hỏi để xem chi tiết</p>
                </div>
            `;
        }

        function deleteQuestion(id) {
            if (!confirm('Xóa câu hỏi này?')) return;

            const ref = database.ref(`questions/public/items/${id}`);
            ref.remove()
                .then(() => {
                    showToast('🗑️ Đã xóa câu hỏi!', 'success');
                    if (selectedId === id) clearDetail();
                })
                .catch(error => { showToast('❌ ' + error.message, 'error'); });
        }

        function clearAll() {
            if (!confirm('⚠️ Xóa TẤT CẢ câu hỏi?')) return;

            const ref = database.ref('questions/public/items');
            ref.remove()
                .then(() => {
                    showToast('🗑️ Đã xóa tất cả.', 'success');
                    clearDetail();
                })
                .catch(error => { showToast('❌ ' + error.message, 'error'); });
        }

        // CẬP NHẬT TỔNG HỢP THỐNG KÊ
        function updateStats(data = []) {
            totalCount.textContent = data.length;

            const fieldSet = new Set();
            const nameSet = new Set();
            const areaCount = {};

            data.forEach(q => {
                if (q.field && q.field.trim()) {
                    fieldSet.add(q.field.trim());
                }
                if (q.fullName && q.fullName.trim()) {
                    nameSet.add(q.fullName.trim().toLowerCase());
                }
                if (q.area && q.area.trim()) {
                    const areaName = q.area.trim();
                    areaCount[areaName] = (areaCount[areaName] || 0) + 1;
                }
            });

            // 1. Số lượng lĩnh vực
            topField.textContent = fieldSet.size;

            // 2. Số lượng người gửi
            topPerson.textContent = nameSet.size;

            // 3. Khu vực gửi nhiều nhất
            let topA = '—', topAVal = 0;
            for (const [area, count] of Object.entries(areaCount)) {
                if (count > topAVal) { 
                    topAVal = count; 
                    topA = area; 
                }
            }
            topArea.textContent = topAVal > 0 ? `${topA} (${topAVal})` : '—';
        }

        function exportSummary() {
            if (filteredQuestions.length === 0) {
                showToast('⚠️ Chưa có câu hỏi để xuất!', 'error');
                return;
            }

            const data = [...filteredQuestions].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            const mainData = [
                ['STT', 'Họ và tên', 'Số điện thoại', 'Địa chỉ', 'Khu vực', 'Lĩnh vực', 'Nội dung câu hỏi', 'Tệp đính kèm', 'Thời gian gửi']
            ];

            data.forEach((q, index) => {
                let fileStr = 'Không';
                if (q.files && q.files.length > 0) {
                    fileStr = q.files.map(f => f.name || f.ghPath).join('; ');
                } else if (q.fileUrl || q.file || q.ghPath) {
                    fileStr = q.fileName || q.ghPath || 'Có file';
                }

                mainData.push([
                    index + 1,
                    q.fullName || '',
                    q.phone || '',
                    q.address || '',
                    q.area || '',
                    q.field || '',
                    q.question || '',
                    fileStr,
                    q.created || ''
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(mainData);
            ws['!cols'] = [
                { wch: 6 }, { wch: 22 }, { wch: 18 }, { wch: 30 },
                { wch: 15 }, { wch: 20 }, { wch: 50 }, { wch: 25 }, { wch: 22 }
            ];
            XLSX.utils.book_append_sheet(wb, ws, 'Câu hỏi');

            const filename = `tong_hop_cau_hoi_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(wb, filename);
            showToast('📨 Đã xuất file Excel thành công!', 'success');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        console.log('📊 Dashboard đã sẵn sàng!');
    </script>
